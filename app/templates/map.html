<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>My English Adventure</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="app">
    <!-- MAP VIEW -->
    <main id="map-view" class="view">
      <header class="topbar">
        <h1 class="title">My English Adventure</h1>
        <div class="progress" aria-label="Completed levels"><span id="star-count">0</span>/<span id="star-total">30</span></div>
      </header>
      <div id="map-loading" class="status-card" role="status">Loading your adventure…</div>
      <div id="map-error" class="status-card hidden" role="alert">
        <strong>The map is taking a nap.</strong>
        <button id="map-retry" type="button">Try again</button>
      </div>
      <div id="bg-layer" class="bg-layer" aria-hidden="true"></div>
      <div id="map-scroll" class="hidden">
        <svg id="path-svg" class="path-layer" aria-hidden="true"></svg>
        <div id="map"></div>
      </div>
    </main>

    <!-- LEVEL DETAIL VIEW -->
    <section id="detail-view" class="view hidden">
      <div class="detail-card">
        <div class="detail-header">
          <div class="detail-header__left">
            <button id="back-btn" class="back-btn" type="button">&#8592; Map</button>
            <div class="detail-title-area">
              <h1 id="detail-title"></h1>
              <div class="detail-meta">
                <span id="detail-chapter" class="chip"></span>
                <div id="detail-patterns" class="patterns-row"></div>
              </div>
            </div>
          </div>
          <details class="videogen-toggle">
            <summary>VideoGen</summary>
            <div id="detail-prompts" class="prompt-section"></div>
          </details>
        </div>

        <div class="detail-body">
          <!-- Top row: two videos side by side, large -->
          <div class="video-row">
            <div class="video-col">
              <div class="section-label">Watch &amp; Learn</div>
              <div id="detail-demo" class="video-slot-wrap"></div>
            </div>
            <div class="video-col">
              <div class="section-label">Your Turn</div>
              <div id="detail-perf" class="video-slot-wrap"></div>
              <div id="detail-star" class="star-row"></div>
            </div>
          </div>

          <!-- Bottom row: dialogue + variations side by side -->
          <div class="text-row">
            <div class="text-col text-col--dialogue">
              <div class="section-label">Read Together</div>
              <div id="detail-dialogue" class="dialogue"></div>
            </div>
            <div class="text-col text-col--vars">
              <div class="section-label">Try This</div>
              <div id="detail-variations" class="variations"></div>
            </div>
          </div>

          <!-- Nav spans full width -->
          <div id="detail-nav" class="detail-nav"></div>
        </div>
      </div>
    </section>
  </div>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
