<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My English Adventure</title>
<style>
    :root {
        --bronze-dark: #3a2518;
        --bronze-mid: #704b32;
        --bronze-light: #b48357;
        --gold-glow: #ffd700;
        --parchment-light: #f9ecd8;
        --parchment-dark: #d5b882;
        --panel-bg: rgba(42, 28, 19, 0.85);
        --text-bright: #f0e6d2;
        --text-dark: #3a2518;
    }

    body {
        margin: 0;
        background: #1a1a1a;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: 'Nunito', 'Segoe UI', sans-serif;
        overflow: hidden;
    }

    /* 游戏主窗口：多重边框模拟金属质感 */
    .game-window {
        width: 1200px;
        height: 800px;
        position: relative;
        background: radial-gradient(circle at center, var(--parchment-light) 0%, var(--parchment-dark) 100%);
        border-radius: 16px;
        box-shadow: 
            0 0 0 4px #111,
            0 0 0 10px var(--bronze-mid),
            0 0 0 14px var(--bronze-dark),
            0 30px 60px rgba(0,0,0,0.8),
            inset 0 0 40px rgba(0,0,0,0.4);
        display: flex;
        flex-direction: column;
    }

    /* 顶部导航条：时钟/齿轮风格 */
    .top-bar {
        height: 50px;
        background: linear-gradient(to bottom, var(--bronze-dark), var(--bronze-mid));
        border-bottom: 3px solid var(--bronze-dark);
        border-radius: 12px 12px 0 0;
        display: flex;
        justify-content: center;
        align-items: center;
        color: var(--text-bright);
        font-size: 20px;
        font-weight: bold;
        text-shadow: 1px 1px 2px #000;
        box-shadow: inset 0 2px 5px rgba(255,255,255,0.2);
    }

    /* 闯关地图区域 */
    .map-section {
        flex: 1;
        position: relative;
        overflow: hidden;
        /* 使用 CSS 模拟手绘网格/纹理背景 */
        background-image: 
            radial-gradient(rgba(0,0,0,0.05) 2px, transparent 2px),
            radial-gradient(rgba(0,0,0,0.05) 2px, transparent 2px);
        background-size: 40px 40px;
        background-position: 0 0, 20px 20px;
    }

    /* SVG 地图路径 */
    .map-path {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
    }

    path.route {
        fill: none;
        stroke: var(--bronze-light);
        stroke-width: 8;
        stroke-dasharray: 12 12;
        stroke-linecap: round;
        filter: drop-shadow(2px 4px 2px rgba(0,0,0,0.3));
    }

    /* 关卡节点：高光与发光特效 */
    .level-node {
        position: absolute;
        width: 64px;
        height: 64px;
        background: linear-gradient(135deg, #ffd700, #b8860b);
        border: 4px solid var(--bronze-dark);
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 28px;
        color: #fff;
        text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        box-shadow: 
            0 8px 15px rgba(0,0,0,0.4),
            inset 0 4px 6px rgba(255,255,255,0.6),
            0 0 20px rgba(255, 215, 0, 0.5); /* 默认发光 */
        cursor: pointer;
        transform: translate(-50%, -50%);
        transition: transform 0.2s, box-shadow 0.2s;
    }

    .level-node:hover {
        transform: translate(-50%, -50%) scale(1.1);
        box-shadow: 
            0 12px 20px rgba(0,0,0,0.5),
            inset 0 4px 6px rgba(255,255,255,0.8),
            0 0 30px rgba(255, 215, 0, 0.9);
    }

    .level-node.locked {
        background: linear-gradient(135deg, #7a7a7a, #4a4a4a);
        color: #aaa;
        box-shadow: 0 4px 8px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.2);
    }

    /* 底部控制面板区域：深色皮革/木纹质感 */
    .panel-section {
        height: 320px;
        background: var(--panel-bg);
        border-top: 6px solid var(--bronze-dark);
        box-shadow: inset 0 10px 20px rgba(0,0,0,0.5);
        display: flex;
        gap: 20px;
        padding: 20px;
        box-sizing: border-box;
    }

    /* 面板卡片：内嵌式复古边框 */
    .panel-card {
        flex: 1;
        background: rgba(0, 0, 0, 0.3);
        border: 2px solid var(--bronze-mid);
        border-radius: 8px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        box-shadow: inset 0 0 15px rgba(0,0,0,0.8), 0 2px 0 rgba(255,255,255,0.1);
        position: relative;
    }

    /* 卡片四角金属装饰 */
    .panel-card::before, .panel-card::after {
        content: '';
        position: absolute;
        width: 10px;
        height: 10px;
        border: 2px solid var(--bronze-light);
        border-radius: 50%;
    }
    .panel-card::before { top: 4px; left: 4px; }
    .panel-card::after { bottom: 4px; right: 4px; }

    .card-title {
        margin: 0 0 12px 0;
        font-size: 16px;
        color: var(--bronze-light);
        text-transform: uppercase;
        letter-spacing: 1px;
        border-bottom: 1px solid var(--bronze-mid);
        padding-bottom: 8px;
        text-shadow: 1px 1px 2px #000;
    }

    /* 视频展示区 */
    .video-container {
        display: flex;
        gap: 12px;
        flex: 1;
    }

    .video-box {
        flex: 1;
        background: #0a0a0a;
        border: 2px solid var(--bronze-dark);
        border-radius: 6px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: #888;
        box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
        cursor: pointer;
        transition: border-color 0.2s;
    }

    .video-box:hover {
        border-color: var(--bronze-light);
        color: var(--text-bright);
    }

    .video-label {
        font-size: 12px;
        margin-bottom: 8px;
        color: var(--bronze-light);
    }

    /* 对话文本区（定制滚动条） */
    .dialogue-box {
        flex: 1;
        overflow-y: auto;
        color: var(--text-bright);
        font-size: 15px;
        line-height: 1.6;
        padding-right: 10px;
    }
    .dialogue-box::-webkit-scrollbar { width: 6px; }
    .dialogue-box::-webkit-scrollbar-thumb { background: var(--bronze-mid); border-radius: 3px; }

    .bubble {
        margin-bottom: 12px;
        padding: 8px 12px;
        border-radius: 8px;
        background: rgba(255,255,255,0.1);
        border-left: 4px solid var(--bronze-light);
    }
    .bubble.child { border-left-color: #4A90E2; background: rgba(74, 144, 226, 0.1); }

    /* 游戏风按钮 */
    .btn {
        background: linear-gradient(to bottom, #4a4a4a, #2a2a2a);
        border: 2px solid var(--bronze-mid);
        color: var(--text-bright);
        padding: 10px 15px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        margin-top: auto;
        text-shadow: 1px 1px 2px #000;
        box-shadow: 0 4px 6px rgba(0,0,0,0.4), inset 0 1px 2px rgba(255,255,255,0.1);
        transition: all 0.1s;
    }
    .btn:active {
        transform: translateY(2px);
        box-shadow: 0 1px 2px rgba(0,0,0,0.4), inset 0 2px 4px rgba(0,0,0,0.6);
    }
</style>
</head>
<body>

<div class="game-window">
    <div class="top-bar">⚙️ Adventure Map</div>

    <!-- 上部：闯关地图 -->
    <div class="map-section">
        <!-- SVG 绘制连线路径 -->
        <svg class="map-path">
            <path class="route" d="M 150,300 Q 300,400 450,250 T 750,200 T 1050,150" />
        </svg>

        <!-- 节点绝对定位在路径上 -->
        <div class="level-node" style="left: 150px; top: 300px;">⭐</div>
        <div class="level-node" style="left: 450px; top: 250px;">▶️</div>
        <div class="level-node locked" style="left: 750px; top: 200px;">🔒</div>
        <div class="level-node locked" style="left: 1050px; top: 150px;">🔒</div>
    </div>

    <!-- 下部：控制面板 -->
    <div class="panel-section">
        <!-- 视频区 -->
        <div class="panel-card" style="flex: 1.2;">
            <h3 class="card-title">Video & Learning</h3>
            <div class="video-container">
                <div class="video-box">
                    <span class="video-label">Watch & Learn</span>
                    <span>▶️ Play Demo</span>
                </div>
                <div class="video-box">
                    <span class="video-label">Your Turn</span>
                    <span style="font-size: 24px;">+</span>
                    <span style="font-size: 12px; margin-top: 4px;">Upload MP4</span>
                </div>
            </div>
        </div>

        <!-- 对话区 -->
        <div class="panel-card" style="flex: 1.2;">
            <h3 class="card-title">Dialogue</h3>
            <div class="dialogue-box">
                <div class="bubble dad"><strong>🐶 Dad:</strong> Buddy, can I have the blue block?</div>
                <div class="bubble child"><strong>🐯 Child:</strong> Yes, you can! Here you go.</div>
                <div class="bubble dad"><strong>🐶 Dad:</strong> Thank you!</div>
            </div>
        </div>

        <!-- 提示词区 -->
        <div class="panel-card" style="flex: 0.6;">
            <h3 class="card-title">VideoGen</h3>
            <div style="color: #aaa; font-size: 12px; margin-bottom: 15px;">Sora Prompts Generator</div>
            <button class="btn" style="margin-bottom: 10px;">Copy Part A</button>
            <button class="btn">Copy Part B</button>
        </div>
    </div>
</div>

</body>
</html>
