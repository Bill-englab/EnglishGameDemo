<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>My English Adventure</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="app">
    <!-- MAP VIEW -->
    <main id="map-view" class="view">
      <header class="topbar">
        <h1 class="title">My English Adventure</h1>
        <div class="progress" aria-label="Completed levels"><span id="star-count">0</span>/<span id="star-total">30</span></div>
      </header>
      <div id="map-loading" class="status-card" role="status">Loading your adventure…</div>
      <div id="map-error" class="status-card hidden" role="alert">
        <strong>The map is taking a nap.</strong>
        <button id="map-retry" type="button">Try again</button>
      </div>
      <div id="bg-layer" class="bg-layer" aria-hidden="true"></div>
      <div id="map-scroll" class="hidden">
        <svg id="path-svg" class="path-layer" aria-hidden="true"></svg>
        <div id="map"></div>
      </div>
    </main>

    <!-- LEVEL DETAIL VIEW -->
    <section id="detail-view" class="view hidden">
      <div class="detail-card">
        <div class="detail-header">
          <button id="back-btn" class="back-btn" type="button">&#8592; Map</button>
          <div id="detail-chapter" class="chip"></div>
        </div>

        <div class="detail-body">
          <!-- Left column: videos (primary focus) -->
          <div class="detail-col detail-col--video">
            <h1 id="detail-title"></h1>
            <div id="detail-patterns" class="patterns-row"></div>
            <p id="detail-scene" class="scene"></p>

            <div class="section-label">Demo Video</div>
            <div id="detail-demo" class="demo-wrap"></div>

            <div class="section-label">Performance Video</div>
            <div id="detail-star" class="star-row"></div>
            <div id="detail-perf" class="perf-wrap"></div>

            <div id="detail-nav" class="detail-nav"></div>
          </div>

          <!-- Right column: text content -->
          <div class="detail-col detail-col--text">
            <div class="section-label">Dialogue</div>
            <div id="detail-dialogue" class="dialogue"></div>

            <div class="section-label">Variations</div>
            <div id="detail-variations" class="variations"></div>

            <div class="section-label">Sora Prompts</div>
            <div id="detail-prompts" class="prompt-section"></div>
          </div>
        </div>
      </div>
    </section>
  </div>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
